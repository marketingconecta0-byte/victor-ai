name: Publicar Victor AI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
